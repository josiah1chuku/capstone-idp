# Kyverno: the admission-time guardrail layer (layer 2 of 3, FR4 and H2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.9.2 # Kyverno v1.19.2
    helm:
      releaseName: kyverno
      valuesObject:
        config:
          # AKS's admissions enforcer would otherwise rewrite Kyverno's webhooks.
          webhookAnnotations:
            admissions.enforcer/disabled: "true"
        # Single replicas for the testbed. Production would run 3 admission replicas.
        admissionController:
          replicas: 1
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true # Kyverno's CRDs are too large for client-side apply
